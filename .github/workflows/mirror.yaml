name: Mirror

on:
  push:
    branches: [master]

jobs:
  mirror:
    uses: AdGuardSoftwareLimited/actions/.github/workflows/mirror.yml@master
    with:
      target_repo: 'git@github.com:AdguardTeam/urlfilter.git'
      vault_role: github-mirroring
      vault_secret: secret/data/ci-secrets/adguard-team-org-key#private
    permissions:
      contents: read
      id-token: write
